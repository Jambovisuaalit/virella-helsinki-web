name: Runtime E2E order onboarding patched

on:
  push:
    branches:
      - qa/runtime-e2e-20260911

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install browser runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/virella-e2e-patched
          cd /tmp/virella-e2e-patched
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Extract existing QA script and patch current production UI handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/runtime-e2e-checkout.yml').read_text()
          marker = "cat > e2e.mjs <<'NODE'\n"
          start = src.index(marker) + len(marker)
          end = src.index('\n          NODE', start)
          lines = src[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          email_target = "  await fillField(['input[type=\"email\"]', 'input[name=\"email\"]'], 'e2e.conversion.fix@example.com');"
          if email_target not in script:
              raise SystemExit('email fill target not found')
          script = script.replace(email_target, "  await page.waitForTimeout(1500);\n" + email_target, 1)
          script = script.replace('[page, ...page.frames()]', '[page]')
          script = script.replace('input[name=\"postalCode\"]', 'input[name=\"billingPostalCode\"]')
          script = script.replace('/Lähetä alkukysely/i', '/Lähetä aloituskysely/i')
          script = script.replace("'Alkukysely vastaanotettu.'", "'Aloituskysely vastaanotettu.'")

          submit_target = "  let submit = page.getByRole('button', { name: /Maksa|Pay|Osta|Purchase/i }).last();"
          disclosure = "  const checkboxes = page.locator('input[type=\"checkbox\"]');\n  if (await checkboxes.count() > 1) {\n    try { await checkboxes.last().check(); } catch {}\n  }\n\n"
          if submit_target not in script:
              raise SystemExit('submit target not found')
          script = script.replace(submit_target, disclosure + submit_target, 1)

          Path('/tmp/virella-e2e-patched/e2e.mjs').write_text(script)
          PY

      - name: Run order onboarding gate
        shell: bash
        env:
          APP_URL: https://virellahelsinki.com
        run: |
          set -euo pipefail
          cd /tmp/virella-e2e-patched
          node e2e.mjs
